<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Checkout: Shipping Address V1</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1152d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            min-height: 100dvh;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-[#0d121b] dark:text-white min-h-screen flex flex-col">
    <div class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
        <div class="flex items-center p-4 justify-between">
            <div class="flex items-center gap-2">
                <span
                    class="material-symbols-outlined text-[#0d121b] dark:text-white cursor-pointer">arrow_back_ios</span>
            </div>
            <h2 class="text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-6">Checkout</h2>
        </div>
        <div class="px-6 py-4 flex items-center justify-between relative max-w-md mx-auto w-full">
            <div class="absolute top-[2.25rem] left-10 right-10 h-[2px] bg-gray-200 dark:bg-gray-700 -z-10"></div>
            <div class="flex flex-col items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold ring-4 ring-background-light dark:ring-background-dark">
                    1
                </div>
                <span class="text-xs font-bold text-primary">Shipping</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-500 flex items-center justify-center text-sm ring-4 ring-background-light dark:ring-background-dark">
                    2
                </div>
                <span class="text-xs font-medium text-gray-500">Payment</span>
            </div>
            <div class="flex flex-col items-center gap-2">
                <div
                    class="w-8 h-8 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-500 flex items-center justify-center text-sm ring-4 ring-background-light dark:ring-background-dark">
                    3
                </div>
                <span class="text-xs font-medium text-gray-500">Review</span>
            </div>
        </div>
    </div>
    <main class="flex-1 px-4 py-6 max-w-md mx-auto w-full">
        <h3 class="text-xl font-bold mb-6">Shipping Address</h3>
        <div
            class="bg-white dark:bg-[#1a2133] rounded-2xl p-6 shadow-sm border border-gray-100 dark:border-gray-800 space-y-4">
            <div class="flex flex-col">
                <label class="text-sm font-medium mb-1.5 text-gray-600 dark:text-gray-400">Full Name</label>
                <input
                    class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:border-primary focus:ring-0 outline-none transition-colors"
                    placeholder="e.g. Johnathan Doe" type="text" />
            </div>
            <div class="flex flex-col">
                <label class="text-sm font-medium mb-1.5 text-gray-600 dark:text-gray-400">Phone Number</label>
                <input
                    class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:border-primary focus:ring-0 outline-none transition-colors"
                    placeholder="+1 (555) 000-0000" type="tel" />
            </div>
            <div class="flex flex-col">
                <label class="text-sm font-medium mb-1.5 text-gray-600 dark:text-gray-400">Street Address</label>
                <input
                    class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:border-primary focus:ring-0 outline-none transition-colors"
                    placeholder="Street name and house number" type="text" />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="flex flex-col">
                    <label class="text-sm font-medium mb-1.5 text-gray-600 dark:text-gray-400">City</label>
                    <input
                        class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:border-primary focus:ring-0 outline-none transition-colors"
                        placeholder="City" type="text" />
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-medium mb-1.5 text-gray-600 dark:text-gray-400">State</label>
                    <input
                        class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:border-primary focus:ring-0 outline-none transition-colors"
                        placeholder="State" type="text" />
                </div>
            </div>
            <div class="flex flex-col">
                <label class="text-sm font-medium mb-1.5 text-gray-600 dark:text-gray-400">ZIP Code</label>
                <input
                    class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-transparent focus:border-primary focus:ring-0 outline-none transition-colors"
                    placeholder="00000" type="text" />
            </div>
            <div class="flex items-center gap-2 pt-2">
                <input class="rounded border-gray-300 dark:border-gray-700 text-primary focus:ring-primary h-5 w-5"
                    id="saveAddress" type="checkbox" />
                <label class="text-sm text-gray-600 dark:text-gray-400 font-medium" for="saveAddress">Save this address
                    as default</label>
            </div>
        </div>
        <div class="mt-8 p-4 bg-primary/5 dark:bg-primary/10 rounded-xl">
            <div class="flex justify-between items-center text-sm mb-2">
                <span class="text-gray-500">Subtotal (3 items)</span>
                <span class="font-medium">$249.00</span>
            </div>
            <div class="flex justify-between items-center text-sm mb-2">
                <span class="text-gray-500">Shipping</span>
                <span class="font-medium text-emerald-500">Calculated later</span>
            </div>
            <div class="h-px bg-gray-200 dark:bg-gray-700 my-2"></div>
            <div class="flex justify-between items-center font-bold text-lg">
                <span>Total Amount</span>
                <span class="text-primary">$249.00</span>
            </div>
        </div>
    </main>
    <footer
        class="sticky bottom-0 bg-white dark:bg-background-dark border-t border-gray-200 dark:border-gray-800 p-4 pb-8">
        <div class="max-w-md mx-auto flex items-center gap-4">
            <button class="flex items-center justify-center px-4 h-14 font-semibold text-gray-400 dark:text-gray-500">
                Back
            </button>
            <button
                class="flex-1 bg-primary text-white h-14 rounded-xl font-bold text-base shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform">
                Continue to Payment
            </button>
        </div>
    </footer>

</body>

</html>
